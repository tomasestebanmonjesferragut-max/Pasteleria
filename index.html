  <meta property="og:title" content="Dulzura en tu Hogar | Pastelería, Perfumes y Almacén">
  <meta property="og:description" content="Dulzura en tu Hogar: pastelería artesanal, perfumes y productos de almacén en Maipú, Santiago. Pide por WhatsApp y recibe en tu puerta.">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://tomasestebanmonjesferragut-max.github.io/Pasteleria/assets/images/negocio.jpg">

</head>
